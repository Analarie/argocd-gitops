---
# PostgreSQL Cluster para ambiente PROD
# High Availability com 3 réplicas

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mamaloo-db-prod
  namespace: mamaloo-prod
  labels:
    app: mamaloo
    environment: prod
    component: database
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 3
  
  imageName: ghcr.io/cloudnative-pg/postgresql:15.5
  
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "512MB"
      effective_cache_size: "2GB"
      maintenance_work_mem: "128MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      random_page_cost: "1.1"
      effective_io_concurrency: "200"
      work_mem: "5242kB"
      min_wal_size: "2GB"
      max_wal_size: "8GB"
      max_worker_processes: "4"
      max_parallel_workers_per_gather: "2"
      max_parallel_workers: "4"
  
  bootstrap:
    initdb:
      database: mamaloo_prod
      owner: mamaloo_prod_user
      secret:
        name: mamaloo-db-credentials
  
  storage:
    size: 20Gi
    storageClass: standard
  
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  
  monitoring:
    enablePodMonitor: true
  
  backup:
    barmanObjectStore:
      destinationPath: "s3://mamaloo-backups/prod"
      s3Credentials:
        accessKeyId:
          name: backup-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: backup-credentials
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 2
    retentionPolicy: "30d"
  
  # Configurações de HA
  primaryUpdateStrategy: unsupervised
  
  # Anti-affinity para distribuir réplicas
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: cnpg.io/cluster
                  operator: In
                  values:
                    - mamaloo-db-prod
            topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Secret
metadata:
  name: mamaloo-db-credentials
  namespace: mamaloo-prod
  labels:
    app: mamaloo
    environment: prod
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
type: kubernetes.io/basic-auth
stringData:
  username: mamaloo_prod_user
  password: Pr0dP@ssw0rd!Secur3Mamal00

---
# CloudNative PG Operator Installation
# Docs: https://cloudnative-pg.io/documentation/current/installation_upgrade/

apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
  labels:
    app: cloudnative-pg
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg-operator
  namespace: argocd
  labels:
    app: cnpg-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  
  source:
    repoURL: 'https://cloudnative-pg.github.io/charts'
    chart: cloudnative-pg
    targetRevision: 0.21.0
    helm:
      values: |
        replicaCount: 1
        
        image:
          repository: ghcr.io/cloudnative-pg/cloudnative-pg
          pullPolicy: IfNotPresent
        
        crds:
          create: true
        
        webhook:
          port: 9443
          mutating:
            create: true
          validating:
            create: true
        
        monitoring:
          podMonitorEnabled: false
          grafanaDashboard:
            create: false
        
        config:
          data:
            INHERITED_ANNOTATIONS: "argocd.argoproj.io/sync-wave"
            INHERITED_LABELS: "app,environment"
        
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
  
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: cnpg-system
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
